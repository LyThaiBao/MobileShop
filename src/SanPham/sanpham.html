</head>
     <body>

     <header id="header" class="d-flex justify-content-between align-items-center bg-primary-app px-2 py-2">
        <div id="header_hamberger" class="d-md-none cursor-pointer text-navy fs-sm"><i class="bi bi-list"></i></div>

               top-0 end-50 transition translate-full-x  px-2  position-md-relative translateX-md-0 flex-md-grow-1">
          <div class="d-flex d-md-none justify-content-between align-items-center">
               <a href=""  id="nav_logo">
               <!-- <img src="./p" alt=""> -->
               </a>
               <span class="nav_close cursor-pointer fs-sm text-danger"><i class="bi bi-x"></i></span>
          </div>
          <div class="navbar_swpage d-flex flex-column bold mt-2 text-navy pt-2 gap-3 flex-md-row align-items-center pt-md-0 mt-md-0 fs-md  justify-content-between justify-content-md-center gap-md-5">

               <a href="../../src/GioiThieu/gioithieu.html" class="d-flex gap-2"><i class="bi bi-info-circle d-md-none"></i> <span data-lang="nav.about" class="fw-bold">Giới Thiệu</span></a>
               <a href="../../src/Lienhe/lienhe.html" class="d-flex gap-2 pr-3"><i class="bi bi-telephone d-md-none"></i> <span data-lang="nav.contact" class="fw-bold">Liên Hệ</span></a>

               <img src="../../public/imgs/country/vn.png" alt="vn" tabindex="-1" id="btn_vn" role="button">
               <img src="../../public/imgs/country/us.png" alt="us" tabindex="-1" id="btn_us" role="button">

          </div>
          <div id="overlay-placeholder" class="z-99 d-md-none"></div>

          <main id="main" class="px-3">
          <div class="row">

               <div class="toast-container position-fixed top-0 end-0 p-3">
                    <!-- Toast của bootstrap dung de thong bao -->
                    <div id="cartToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                         <div id="toastHeader">
                              <strong class="me-auto" id="from"></strong>
                              <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                         </div>
                         <div class="toast-body" id="toastBody"></div>
                    </div>
               </div>

               <!-- data-bs-toggle="offcanvas" và data-bs-target="#filterOffcanvas" ản hiện phần tử có id filterOffcanvas -->
               <button class="btn btn-info d-xl-none mt-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterOffcanvas" data-lang="product.filter.title">
               Bộ lọc
               </button>
          <!-- offcanvas-lg class của bootstrap, khi duoi lg sẽ hien duoi dang panel ẩn hiện có overlay -->
          <!-- offcanvas-start trược vào từ bên trái -->
          <!-- style="--bs-offcanvas-width: 80vw;" áp dụng kích thước với phần tử có offcanvas-lg  -->
               <div class="offcanvas-xl offcanvas-start col-xl-3 px-3" tabindex="-1" id="filterOffcanvas" style="--bs-offcanvas-width: 50vw;">
                    <div class="offcanvas-header d-xl-none">
                         <h5 class="offcanvas-title" data-lang="product.filter.title">Bộ lọc</h5>
                         <button type="button" class="btn-close" data-bs-toggle="offcanvas" data-bs-target="#filterOffcanvas"></button>
                    </div>
                    <div class="">
                         <form action="" id="filter_form">
                              <fieldset class="d-flex flex-column">
                                   <legend class="mb-0 pt-5" data-lang="product.filter.brand">Hãng</legend>
                                   <label class="brand-check">Apple
                                        <input type="checkbox" value="Apple" name="hang">
                                        <span class="checkmark"></span>
                                   </label>
                                   <label class="brand-check">Samsung
                                        <input type="checkbox" value="Samsung" name="hang">
                                        <span class="checkmark"></span>
                                   </label>
                                   <label class="brand-check">OPPO
                                        <input type="checkbox" value="OPPO" name="hang">
                                        <span class="checkmark"></span>
                                   </label>
                                   <label class="brand-check">Xiaomi
                                        <input type="checkbox" value="Xiaomi" name="hang">
                                        <span class="checkmark"></span>
                                   </label>
                                   <label class="brand-check">Nubia
                                        <input type="checkbox" value="Nubia" name="hang">
                                        <span class="checkmark"></span>
                                   </label>
                                   <label class="brand-check">HONOR
                                        <input type="checkbox" value="HONOR" name="hang">
                                        <span class="checkmark"></span>
                                   </label>
                              </fieldset>
                              <fieldset class="mt-4">
                                   <legend class="mb-0" data-lang="product.filter.price">Giá</legend>
                                   <label class="brand-check">
                                       <span data-lang="product.filter.priceUnder10"></span>
                                        <input type="radio" value="0-10000000" name="gia">
                                        <span class="radiomark"></span>
                                   </label>
                                   <label class="brand-check">
                                          <span data-lang="product.filter.price10to20"></span>
                                        <input type="radio" value="10000000-20000000" name="gia">
                                        <span class="radiomark"></span>
                                   </label>
                                   <label class="brand-check">
                                        <span data-lang="product.filter.price20to30"></span>
                                        <input type="radio" value="20000000-30000000" name="gia">
                                        <span class="radiomark"></span>
                                   </label>
                                   <label class="brand-check">
                                        <span data-lang="product.filter.price30to45"></span>
                                        <input type="radio" value="30000000-45000000" name="gia">
                                        <span class="radiomark"></span>
                                   </label>
                                   <label class="brand-check">
                                        <span data-lang="product.filter.priceOver45"></span>
                                        <input type="radio" value="45000000-999999999" name="gia">
                                        <span class="radiomark"></span>
                                   </label>
                              </fieldset>
                         </form>
                    </div>
               </div>

     <div id="container_products" class="px-3 col-xl-9">
     </div>

          </div>

          
          </main>
          
          <footer class="px-3" id="footer">
          
          </footer>
          <div id="bottom-placeholder" class=""></div>
     </div>
