<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng ký tài khoản</title>


   

    <!-- bootstrap -->
    <link rel="stylesheet"
          href="../lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- root css -->
    <link rel="stylesheet"
          href="../public/css/root.css">

    <!-- icon -->
    <link rel="stylesheet"
          href="../lib/bootstrap-icons-1.13.1/bootstrap-icons.min.css">


   

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;

            min-height: 100%;

            margin: 0;

            padding: 0;

        }


        body {

            background: #f5f7fb;

        }



        .auth-page {

            width: 100%;

            min-height: calc(100vh - 120px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

        }


        

        .auth-card {

            width: 100%;

            max-width: 500px;

            background: #ffffff;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);

        }


        

        .auth-title {

            text-align: center;

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .auth-subtitle {

            text-align: center;

            color: #6c757d;

            font-size: 15px;

            margin-bottom: 25px;

        }


        
        .auth-label {

            display: block;

            font-weight: 600;

            margin-bottom: 7px;

        }


        

        .auth-input {

            width: 100%;

            height: 48px;

            border-radius: 10px;

            font-size: 15px;

        }


        .auth-input:focus {

            border-color: #0d6efd;

            box-shadow: none;

        }


        

        .password-box {

            position: relative;

            width: 100%;

        }


        .password-box input {

            padding-right: 48px;

        }


        .toggle-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 35px;

            height: 35px;

            border: none;

            background: transparent;

            color: #6c757d;

            cursor: pointer;

        }


       

        .auth-btn {

            width: 100%;

            min-height: 48px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;

        }


       

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0;

            color: #6c757d;

            font-size: 14px;

        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #dee2e6;

        }


        .google-area {

            width: 100%;

            display: flex;

            justify-content: center;

            overflow: hidden;

        }


        #googleRegisterButton {

            max-width: 100%;

        }


        

        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #6c757d;

            font-size: 15px;

        }


        .login-link a {

            color: #0d6efd;

            font-weight: 600;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


       
        .home-link {

            text-align: center;

            margin-top: 15px;

        }


        .home-link a {

            color: #6c757d;

            text-decoration: none;

        }


        .home-link a:hover {

            color: #0d6efd;

        }


        

        .auth-message {

            display: none;

            width: 100%;

            padding: 11px 13px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;

            word-break: break-word;

        }


        .auth-message.error {

            display: block;

            color: #842029;

            background: #f8d7da;

            border: 1px solid #f5c2c7;

        }


        .auth-message.success {

            display: block;

            color: #0f5132;

            background: #d1e7dd;

            border: 1px solid #badbcc;

        }



        @media (min-width: 577px) and (max-width: 991px) {

            .auth-page {

                padding: 35px 25px;

            }


            .auth-card {

                max-width: 520px;

                padding: 32px;

            }

        }


        
        @media (max-width: 576px) {

            .auth-page {

                min-height: calc(100vh - 100px);

                padding: 25px 14px;

                align-items: flex-start;

            }


            .auth-card {

                max-width: 100%;

                padding: 25px 18px;

                border-radius: 14px;

                box-shadow:
                    0 5px 20px rgba(0, 0, 0, 0.08);

            }


            .auth-title {

                font-size: 24px;

            }


            .auth-subtitle {

                font-size: 14px;

                margin-bottom: 20px;

            }


            .auth-label {

                font-size: 14px;

            }


            .auth-input {

                height: 46px;

                font-size: 14px;

            }


            .auth-btn {

                min-height: 46px;

                font-size: 15px;

            }


            .login-link {

                font-size: 14px;

            }


            .home-link {

                font-size: 14px;

            }

        }


       

        @media (max-width: 375px) {

            .auth-page {

                padding: 18px 10px;

            }


            .auth-card {

                padding: 22px 14px;

            }


            .auth-title {

                font-size: 22px;

            }


            .auth-subtitle {

                font-size: 13px;

            }


            .form-check-label {

                font-size: 13px;

            }

        }


        
        @media (min-width: 1200px) {

            .auth-card {

                max-width: 520px;

                padding: 40px;

            }


            .auth-title {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    
    <div class="wrapper ">


        <header id="header"
                class="d-flex justify-content-between align-items-center bg-primary-app px-2">
        </header>


        

        <main class="auth-page">


            <div class="auth-card">


                <h1 class="auth-title">
                    Tạo tài khoản
                </h1>


                <p class="auth-subtitle">
                    Đăng ký để bắt đầu mua sắm
                </p>


                

                <div id="registerMessage"
                     class="auth-message">
                </div>


                

                <div class="mb-3">

                    <label class="auth-label">
                        Họ và tên
                    </label>


                    <input
                        type="text"
                        id="registerName"
                        class="form-control auth-input"
                        placeholder="Nhập họ và tên">

                </div>



                <div class="mb-3">

                    <label class="auth-label">
                        Số điện thoại
                    </label>


                    <input
                        type="tel"
                        id="registerPhone"
                        class="form-control auth-input"
                        placeholder="Nhập số điện thoại">

                </div>


                

                <div class="mb-3">

                    <label class="auth-label">
                        Email
                    </label>


                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control auth-input"
                        placeholder="Nhập email">

                </div>


               

                <div class="mb-3">

                    <label class="auth-label">
                        Mật khẩu
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            class="form-control auth-input"
                            placeholder="Ít nhất 6 ký tự">


                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword(
                                'registerPassword',
                                'registerPasswordIcon'
                            )">

                            <i id="registerPasswordIcon"
                               class="bi bi-eye">
                            </i>

                        </button>

                    </div>

                </div>


                

                <div class="mb-3">

                    <label class="auth-label">
                        Xác nhận mật khẩu
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="registerConfirmPassword"
                            class="form-control auth-input"
                            placeholder="Nhập lại mật khẩu">


                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword(
                                'registerConfirmPassword',
                                'registerConfirmPasswordIcon'
                            )">

                            <i id="registerConfirmPasswordIcon"
                               class="bi bi-eye">
                            </i>

                        </button>

                    </div>

                </div>


                

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="agreeTerms">


                    <label class="form-check-label"
                           for="agreeTerms">

                        Tôi đồng ý với điều khoản sử dụng

                    </label>

                </div>


                

                <button
                    type="button"
                    class="btn btn-primary auth-btn"
                    onclick="registerAccount()">

                    <i class="bi bi-person-plus"></i>

                    Tạo tài khoản

                </button>


                

                <div class="divider">
                    hoặc
                </div>


                <div class="google-area">

                    <div id="googleRegisterButton">
                    </div>

                </div>


                

                <div class="login-link">

                    Đã có tài khoản?

                    <a href="Dangnhap.html">

                        Đăng nhập

                    </a>

                </div>


                

                <div class="home-link">

                    <a href="TrangChu.html">

                        <i class="bi bi-house"></i>

                        Về trang chủ

                    </a>

                </div>


            </div>

        </main>


        

        <div id="bottom-placeholder"
             class="">
        </div>


    </div>


    
    <script src="./components/header/loadHeader.js"
            type="module">
    </script>

    <script src="./components/bottom_mobile/loadBottomMobile.js"
            type="module">
    </script>


    

    <script src="https://accounts.google.com/gsi/client"
            async
            defer>
    </script>


        
</body>

</html>
```
